
name: Build Ronu ki Party APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Ronu_ki_Party_Android_Builder.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android builder
        run: |
          mkdir -p /tmp/ronu-builder
          unzip -o Ronu_ki_Party_Android_Builder.zip -d /tmp/ronu-builder
          cp -R /tmp/ronu-builder/android-wrapper ./android-wrapper

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android-wrapper
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronu-ki-Party-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
